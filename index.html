<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高中生物实验</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }

        /* 动态背景：渐变循环动画，避免单调 */
        body {
            min-height: 100vh;
            background: linear-gradient(45deg, #667eea, #764ba2, #f093fb, #f5576c);
            background-size: 400% 400%;
            animation: dynamicBg 15s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        @keyframes dynamicBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 视频卡片容器 */
        .video-card {
            width: 800px;
            max-width: 90vw;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-bottom: 30px;
        }

        /* 视频区域 */
        .video-wrapper {
            width: 100%;
            height: 680px;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 视频控制栏 */
        .video-controls {
            width: 100%;
            padding: 15px 20px;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* 自定义控制按钮 */
        .control-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* 阶段按钮微调 */
        .stage-btn {
            padding: 8px 12px;
            font-size: 13px;
        }

        /* 禁用状态按钮样式（仅重置后不影响，所有阶段按钮默认不禁用） */
        .control-btn:disabled {
            background: linear-gradient(135deg, #888, #555);
            cursor: not-allowed;
            transform: none;
            opacity: 0.6;
        }

        .control-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #5a6edb, #6b4191);
            transform: scale(1.05);
        }

        /* 进度条样式 */
        progress {
            flex: 1;
            height: 8px;
            border-radius: 4px;
            appearance: none;
            min-width: 200px;
        }

        progress::-webkit-progress-bar {
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        progress::-webkit-progress-value {
            background: linear-gradient(135deg, #667eea, #f093fb);
            border-radius: 4px;
        }

        /* 视频标题 */
        .video-title {
            color: white;
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        /* 页面跳转按钮样式 */
        .jump-btn {
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #f5576c, #f093fb);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
        }

        .jump-btn:hover {
            background: linear-gradient(135deg, #e44a5d, #e87fda);
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        /* 跳转按钮容器 */
        .jump-btn-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>


    <div class="video-card">
        <div class="video-wrapper">
            <video id="targetVideo">
                <source src="c5e55092-e319-4fc3-b5c8-a27dbf45f98f_2.mp4" type="video/mp4">
                你的浏览器不支持HTML5视频播放，请升级浏览器
            </video>
        </div>

        <!-- 所有阶段按钮均移除disabled属性，默认可点击 -->
        <div class="video-controls">
            <button class="control-btn stage-btn" id="stage1Btn">核糖体</button>
            <button class="control-btn stage-btn" id="stage2Btn">内质网</button>
            <button class="control-btn stage-btn" id="stage3Btn">高尔基体</button>
            <button class="control-btn stage-btn" id="stage4Btn">囊泡</button>
            <button class="control-btn stage-btn" id="stage5Btn">膜外</button>
            <button class="control-btn stage-btn" id="stage6Btn">全过程</button>

            <button class="control-btn" id="resetBtn">重置视频</button>
            <progress id="videoProgress" value="0" max="100"></progress>
        </div>
    </div>



    <script>
        // ====================== 后台核心配置（仅在代码中修改，页面不显示） ======================
        // 1. 配置各阶段的【起止秒数】（关键：可直接修改这里的数字，调整每个阶段的播放时间段）
        // 格式：[{start: 开始秒数, end: 结束秒数}, ...]
        const videoStagesConfig = [
            { start: 0, end: 1.20 },
            { start: 1.40, end: 2.60 },    // 阶段1：从0秒播放到2秒
            { start: 2.70, end: 4.02 },    // 阶段2：从2秒播放到4秒
            { start: 4.02, end: 5.10 },    // 阶段3：从4秒播放到6秒
            { start: 5.20, end: 6.17 },    // 阶段4：从6秒播放到8秒
            { start: 0, end: 6.17 }    // 阶段5：从8秒播放到10秒（测试视频总长约10秒，可按需调整）
        ];

        // 2. 获取页面元素
        const video = document.getElementById("targetVideo");
        const resetBtn = document.getElementById("resetBtn");
        const videoProgress = document.getElementById("videoProgress");
        // 阶段按钮数组（与上面的配置数组一一对应）
        const stageBtns = [
            document.getElementById("stage1Btn"),
            document.getElementById("stage2Btn"),
            document.getElementById("stage3Btn"),
            document.getElementById("stage4Btn"),
            document.getElementById("stage5Btn"),
            document.getElementById("stage6Btn")
        ];
        // 页面跳转按钮
        const pageJumpBtn1 = document.getElementById("pageJumpBtn1");
        const pageJumpBtn2 = document.getElementById("pageJumpBtn2");

        // ====================== 自由播放核心逻辑（所有按钮均可点击） ======================
        // 1. 为每个阶段按钮绑定自由点击事件（无顺序限制）
        stageBtns.forEach((btn, stepIndex) => {
            btn.onclick = () => {
                // 获取当前阶段的起止秒数（从后台配置中读取）
                const currentStage = videoStagesConfig[stepIndex];
                if (!currentStage) return;

                // 先移除之前可能残留的timeupdate监听，避免多个阶段监听冲突
                video.removeEventListener("timeupdate", handleTimeUpdate);
                
                // 定义统一的进度监听函数（到达结束秒数暂停）
                function handleTimeUpdate() {
                    if (video.currentTime >= currentStage.end) {
                        video.pause();
                        video.removeEventListener("timeupdate", handleTimeUpdate);
                    }
                }

                // 跳转到阶段开始秒数，并播放视频
                video.currentTime = currentStage.start;
                video.play().catch(err => console.error("视频播放失败：", err));

                // 监听视频播放进度，到达阶段结束秒数时自动暂停
                video.addEventListener("timeupdate", handleTimeUpdate);
            };
        });

        // 2. 重置视频功能（回到初始状态，按钮仍保持可点击）
        resetBtn.onclick = () => {
            // 移除进度监听，避免残留
            video.removeEventListener("timeupdate", handleTimeUpdate);
            
            // 视频状态重置
            video.currentTime = 0;
            video.pause();
            videoProgress.value = 0;

            // 所有阶段按钮仍保持可点击（无需禁用/解锁）
        };
        
        // 定义全局的进度监听函数（用于重置时移除）
        function handleTimeUpdate() {}

        // 3. 实时更新进度条
        video.ontimeupdate = () => {
            const progressPercent = (video.currentTime / video.duration) * 100;
            videoProgress.value = isNaN(progressPercent) ? 0 : progressPercent;
        };

        // 4. 点击进度条跳转（保留原有功能）
        videoProgress.onclick = (e) => {
            const clickX = e.offsetX;
            const progressWidth = videoProgress.offsetWidth;
            const targetTime = (clickX / progressWidth) * video.duration;
            video.currentTime = targetTime;
        };

    </script>
</body>
</html>
